name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the theme version
        id: version
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' style.css | tr -d '\r')
          if [ -z "$version" ]; then
            echo "No Version in style.css"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            exit 0
          fi
          tested=$(sed -n 's/^Tested up to:[[:space:]]*//p' style.css | tr -d '\r')
          requires_php=$(sed -n 's/^Requires PHP:[[:space:]]*//p' style.css | tr -d '\r')
          { git log --pretty='- %s' -1; echo; echo "Tested up to: $tested"; echo "Requires PHP: $requires_php"; } > notes.md
          git archive --format=zip --prefix=contabai-theme/ -o contabai-theme.zip HEAD
          gh release create "v$VERSION" contabai-theme.zip --title "Contabai Theme $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
